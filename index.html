<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منظومة مشرفات مكتب إشراف الداخل</title>
<link rel="stylesheet" href="style.css">
<style>
.tile{position:relative}
.tile.soon{opacity:.82}
.soon-tag{position:absolute;top:10px;left:10px;background:#f6f0e4;color:#8a6a1f;border:1px solid #e3d3a8;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <img class="logo" alt="شعار فرقان">
  <h1>منظومة مشرفات مكتب إشراف الداخل</h1>
  <p>جمعية فرقان لتحفيظ القرآن الكريم</p>
</div>
<div class="wrap">
  <div class="grid">
    <a class="tile" href="mushrifat.html">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.2c2.4 0 4 1.8 4 4.3"/></svg>
      <b>مشرفات وحدة الإشراف التربوي</b>
    </a>
    <button type="button" class="tile soon" onclick="soon()">
      <span class="soon-tag">قريباً</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3"/><path d="M6 21v-3.5a6 6 0 0 1 12 0V21"/><path d="M9 3.2c.8-1 2-1.6 3-1.6s2.2.6 3 1.6"/></svg>
      <b>مشرفات وحدة تحفيظ الصغار</b>
    </button>
    <button type="button" class="tile soon" onclick="soon()">
      <span class="soon-tag">قريباً</span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7"/><path d="M8.5 13.5h7"/><path d="M8.5 17h4"/></svg>
      <b>مشرفات وحدة الإشراف الإداري</b>
    </button>
    <a class="tile" href="units.html">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M14 17h6.5M17.25 13.75v6.5"/></svg>
      <b>إدارة الوحدات</b>
    </a>
  </div>
</div>
<script src="logo-config.js"></script>
<script src="config.js"></script>
<script>function soon() { toast('هذه الوحدة قيد الإعداد وستتوفر قريباً'); }</script>
</body>
</html>
