<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المراكز — منظومة مشرفات مكتب إشراف الداخل</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .t-hello{font-size:18px;font-weight:800;color:var(--primary);margin-bottom:4px}
  .t-item{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .t-item.pending{border-color:var(--gold);background:#fffbf2}
  .t-item b{color:var(--primary)}
  .t-item .t-meta{font-size:14px;color:var(--muted);margin:4px 0 10px;line-height:1.8}
  .t-item .act{display:flex;flex-wrap:wrap;gap:8px}
  .t-item .act .btn{padding:8px 14px;font-size:14px}
  .t-badge{display:inline-block;background:var(--primary);color:#fff;border-radius:20px;padding:0 10px;font-size:13px;margin-right:6px}
  .t-signed{font-size:13px;color:#1f7a45;font-weight:700}
  .tile{position:relative}
  .t-tbadge{position:absolute;top:10px;left:10px;background:#c0392b;color:#fff;border-radius:20px;min-width:24px;padding:1px 8px;font-size:13px;font-weight:800}
  .c-banner{background:#fffbf2;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;color:var(--primary);cursor:pointer}
</style>
</head>
<body>
<div class="topbar">
  <img class="logo" alt="شعار فرقان">
  <h1>المراكز</h1>
  <p>خدمات مديرات المراكز</p>
</div>

<div class="wrap">

  <!-- تسجيل الدخول: اسم المركز وكلمة مروره (مثل نظام المقاصف) -->
  <div id="loginView" class="card" style="max-width:420px;margin:30px auto">
    <h2>دخول المراكز</h2>
    <label for="cName">اسم المركز</label>
    <select id="cName"><option value="">جارِ تحميل المراكز...</option></select>
    <label for="cPw">كلمة المرور</label>
    <div class="pw-wrap">
      <input id="cPw" type="password" autocomplete="current-password" placeholder="كلمة مرور المركز">
      <button type="button" class="pw-toggle" onclick="togglePassword('cPw', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button id="cLoginBtn" class="btn block" onclick="cLogin()">دخول</button>
    <p class="rp-hint" style="margin-top:12px;text-align:center">الحساب خاص بالمركز، وكلمة المرور تُطلب من مكتب الإشراف.</p>
    <p style="margin-top:8px;text-align:center"><a class="lnk" href="index.html">الرئيسية</a></p>
  </div>

  <!-- الرئيسية -->
  <div id="homeView" class="hidden">
    <div class="t-hello" id="cHello" style="text-align:center;margin:4px 0 16px"></div>
    <div id="cBanner" class="c-banner hidden" onclick="cShow('reportsView')"></div>
    <div class="grid">
      <button class="tile" onclick="cShow('reportsView')"><span class="t-tbadge hidden" id="tileBadge">0</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9h16"/><path d="M9.5 9v11.5"/><path d="M12.5 13h5"/><path d="M12.5 16.5h3.5"/></svg><b>تقارير زيارة الإشراف الإداري</b></button>
    </div>
    <p style="text-align:center;margin-top:22px"><button class="btn light" onclick="cLogout()">تسجيل الخروج</button></p>
  </div>

  <!-- التقارير -->
  <div id="reportsView" class="hidden">
    <button class="back" onclick="cShow('homeView')">← رجوع</button>
    <div class="stats">
      <div class="stat"><b id="stPending">0</b><span>بانتظار التوقيع</span></div>
      <div class="stat"><b id="stSigned">0</b><span>تقارير موقّعة</span></div>
    </div>
    <div class="card">
      <h2>تقارير بانتظار توقيع المديرة <span class="t-badge" id="pendBadge">0</span></h2>
      <div id="pendList"><p class="empty">جارِ التحميل...</p></div>
    </div>
    <div class="card">
      <h2>التقارير الموقّعة</h2>
      <div id="signedList"><p class="empty">جارِ التحميل...</p></div>
    </div>
    <p style="text-align:center"><button class="btn light" onclick="cLoad()">تحديث</button></p>
  </div>

  <!-- عرض التقرير والتوقيع -->
  <div id="signView" class="hidden">
    <button class="back" onclick="cShow('reportsView')">← رجوع</button>
    <div class="card">
      <div class="ex-bar" id="cBar"></div>
      <div id="cDoc"></div>
    </div>
    <div class="card" id="cSignCard">
      <h2>اعتماد وتوقيع مديرة المركز</h2>
      <label for="cSigner" style="margin-top:0">اسم مديرة المركز</label>
      <input id="cSigner" autocomplete="name">
      <label class="check"><input type="checkbox" id="cAgree"><span>اطّلعتُ على التقرير وما ورد فيه من ملاحظات وتوصيات.</span></label>
      <label>التوقيع</label>
      <div id="cSigW"></div>
      <button id="cSignBtn" class="btn block" onclick="cSign(this)">اعتماد وتوقيع التقرير</button>
    </div>
  </div>

</div>

<script src="logo-config.js"></script>
<script src="config.js"></script>
<script src="idari-print.js"></script>
<script src="centers.js"></script>
</body>
</html>
